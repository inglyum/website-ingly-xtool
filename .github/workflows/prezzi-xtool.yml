name: Prezzi xTool
# Ogni giorno legge prezzi e disponibilità dallo shop ufficiale xtool.eu
# (scripts/prezzi-xtool.mjs). Se qualcosa è cambiato apre (o aggiorna) un
# avviso su GitHub, che arriva per email: si aggiorna dall'Admin → Lab →
# Macchine xTool → «Aggiorna prezzi da xTool» → Pubblica.
# Nessun commit automatico (regola 5): il workflow legge e avvisa, non scrive.
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/prezzi-xtool.mjs'
      - '.github/workflows/prezzi-xtool.yml'
      - 'data/macchine.json'

permissions:
  contents: read
  issues: write

jobs:
  controlla:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Leggi i prezzi dallo shop ufficiale
        id: prezzi
        run: node scripts/prezzi-xtool.mjs | tee resoconto.md
      - name: Avvisa se i prezzi sono cambiati
        if: github.event_name != 'pull_request' && (steps.prezzi.outputs.cambi != '0' || steps.prezzi.outputs.errori != '0')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat resoconto.md
            echo
            echo 'Per aggiornare il sito: Admin → Lab: materiali, macchine, corsi → «📸 Macchine xTool» → «🔄 Aggiorna prezzi da xTool» → 🚀 Pubblica.'
          } > avviso.md
          gh label create prezzi-xtool --color D9B273 --description 'Prezzi xTool cambiati' 2>/dev/null || true
          n=$(gh issue list --label prezzi-xtool --state open --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body-file avviso.md
          else gh issue create --title 'Prezzi xTool cambiati: aggiorna il sito' --label prezzi-xtool --body-file avviso.md; fi
