name: INGLY Real Photo Source Probe
on:
  push:
    branches:
      - feat/real-photography-medusa-media-20261016
    paths:
      - .github/workflows/probe-real-photo-source.yml
jobs:
  verify-photo:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check public licensed stock-photo CDN without API credentials
        run: |
          python3 - <<'PY'
          import urllib.request
          url='https://images.pexels.com/photos/8271816/pexels-photo-8271816.jpeg?auto=compress&cs=tinysrgb&w=1400'
          req=urllib.request.Request(url,headers={'User-Agent':'INGLY-DESIGN-Website/1.0'})
          with urllib.request.urlopen(req,timeout=30) as res:
              body=res.read(4000001)
              print('HTTP',res.status,'Content-Type',res.headers.get('Content-Type'),'bytes',len(body))
              assert res.status==200 and body[:3]==b'\xff\xd8\xff'
              assert len(body)>30000
          print('PASS — authentic Pexels image CDN reachable')
          PY
