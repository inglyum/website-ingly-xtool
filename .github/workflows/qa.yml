# "AI Agents" lato repository: QA + Sync agent.
# Ad ogni push valida i dati e verifica che i file legacy siano allineati ai JSON.
name: QA Agent — valida dati e sincronizzazione
on:
  push:
  pull_request:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installa dipendenze di test
        run: npm install --no-audit --no-fund
      - name: Valida prodotti, categorie e riferimenti
        run: node scripts/validate-data.mjs
      - name: Pagine statiche allineate ai dati
        run: node scripts/prerender.mjs --verifica
      - name: Sitemap allineata alle pagine (e senza indirizzi con #)
        run: node scripts/generate-sitemap.mjs --verifica
      - name: Suite completa
        run: npm test
      - name: Verifica Josefin Popup, Generatori e specifiche xTool
        run: node tests/test-josefin-xtool-studio.mjs
      - name: Verifica Maison reference e dashboard Admin
        run: node tests/test-maison-live.mjs
      - name: Verifica popup Josefin e specifiche ufficiali xTool
        run: node tests/test-josefin-popup-lab.mjs
      - name: Test Signature Showcase e Admin
        run: node tests/test-signature-showcase.mjs
      - name: Valida audit eCommerce Skills con dati reali e Admin
        run: node tests/test-ecommerce-quality.mjs
      - name: Report di qualità ecommerce (non blocca la pubblicazione)
        run: node scripts/ecommerce-audit.mjs
      - name: Invarianti design ecommerce e dati B2B
        run: node tests/test-signature-ui.mjs
      - name: Verifica palette Notte e Oro
        run: node tests/test-notte-oro.mjs
      - name: Verifica integrazione delle otto fasi
        run: node tests/test-notte-oro-integration.mjs
      - name: Smoke test interazioni live Notte e Oro
        run: node tests/test-notte-oro-dom.mjs
      - name: Verifica loader originale e integrazione Admin
        run: node tests/test-owner-loader-admin.mjs
      - name: Verifica sintassi degli script Notte e Oro
        run: |
          node --check assets/js/notte-oro-loader.js
          node --check assets/js/notte-oro-ui.js
      - name: Verifica design system Atelier e contrasto WCAG AA
        run: node tests/test-atelier-foundation.mjs
      - name: Verifica navigazione Atelier e fascia annunci
        run: node tests/test-atelier-navigation.mjs
      - name: Controlla riferimenti immagini nei dati
        run: |
          node -e '
          const fs=require("fs");
          const P=JSON.parse(fs.readFileSync("data/products.json"));
          const C=JSON.parse(fs.readFileSync("data/content.json"));
          let warn=0;
          const check=p=>{if(p&&!fs.existsSync(p)){console.log("⚠ riferimento immagine mancante:",p);warn++}};
          P.forEach(p=>{if(p.img)check(p.img);(p.gallery||[]).forEach(check)});
          (C.PORT||[]).forEach(t=>check(t[3]));
          console.log(warn?warn+" avvisi immagini (non bloccanti)":"✔ riferimenti immagini ok");
          '
      - name: Lighthouse CI — budget performance
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: 'https://www.inglydesign.it/'
          budgetPath: '.lighthousebudget.json'
          uploadArtifacts: true
          temporaryPublicStorage: true
        continue-on-error: true
