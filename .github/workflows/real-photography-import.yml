name: INGLY Real Photo Import — licensed source check
on:
  push:
    branches:
      - feat/real-photography-medusa-media-20261016
    paths:
      - .github/workflows/real-photography-import.yml
      - scripts/import-real-photography.py
      - data/real-photo-sources.json
permissions:
  contents: write
jobs:
  import-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/real-photography-medusa-media-20261016
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic real photo optimization tool
        run: python -m pip install --disable-pip-version-check 'Pillow==10.4.0'
      - name: Download licensed actual photos and generate responsive assets (no AI)
        run: python scripts/import-real-photography.py
      - name: Validate source/photo association and provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          d=json.loads(Path('data/real-photo-sources.json').read_text())
          cats={x['id']:x for x in json.loads(Path('data/categories.json').read_text())}
          mat={x['id']:x for x in json.loads(Path('data/materiali.json').read_text())['materiali']}
          assert len(d['items']) == 22
          for item in d['items']:
              x=(cats if item['entityType']=='category' else mat)[item['entityId']]
              assert x['isDemo'] is True and x['assetKind']=='licensed-stock'
              assert item['provenance']['notInPortfolio']
              for v in item['media']['srcset']:
                  with Image.open(v['url']) as im:
                      assert im.size==(v['width'],v['height']),v
          print('VERIFIED: 22 genuine-photo subjects, 66 responsive WebPs, attribution preserved.')
          PY
      - name: Save reviewed imagery to the isolated feature branch
        run: |
          git config user.name "ingly-photography[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/cat-*.webp img/material-*.webp data/categories.json data/materiali.json data/real-photo-sources.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets: install 22 licensed real photographs and responsive variants [skip ci]"
          git push origin HEAD:feat/real-photography-medusa-media-20261016
