name: INGLY — rebuild commerce responsive branch
on:
  push:
    branches: [feat/commerce-completion-20261015]
    paths:
      - .github/workflows/rebuild-commerce-branch.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/commerce-completion-20261015
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: node scripts/prerender.mjs
      - run: node scripts/generate-sitemap.mjs
      - run: npm test
      - name: Save generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "build: sync responsive theme fallback and prerender [skip ci]"
            git push origin HEAD:feat/commerce-completion-20261015
          fi
