name: INGLY — build e verifica router fallback
on:
  push:
    branches: [feat/admin-totale]
    paths:
      - .github/workflows/sync-admin-branch.yml
permissions:
  contents: write
jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-totale
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Rigenera fallback e dataset
        run: npm run build
      - name: Rigenera pagine per robot e motori di ricerca
        run: |
          node scripts/prerender.mjs
          node scripts/generate-sitemap.mjs
      - name: Debug temporaneo della pagina prodotto dopo la build
        shell: bash
        run: |
          cp tests/test-sito.mjs /tmp/ingly-test-sito-original.mjs
          python3 - <<'PY'
          p='tests/test-sito.mjs'
          s=open(p).read()
          s=s.replace("vc.on('jsdomError', e => {", "vc.on('jsdomError', e => { console.log('DIAGNOSTICA-JSDOM', e.stack, e.detail && e.detail.stack);")
          s=s.replace("if(card) card.click();", "console.log('DIAGNOSTICA-PRODUCT', id, !!card, win.location.pathname, doc.querySelectorAll('[data-action=\\\"open-product\\\"]').length); if(card) card.click();")
          open(p,'w').write(s)
          PY
          node tests/test-sito.mjs > /tmp/ingly-debug-sito.log 2>&1 || true
          grep 'DIAGNOSTICA-' /tmp/ingly-debug-sito.log | head -50 || true
          cp /tmp/ingly-test-sito-original.mjs tests/test-sito.mjs
      - name: Esegue tutti i test
        run: npm test
      - name: Commit atomico dei file generati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "Build aggiornata, nessun file da committare."
          else
            git commit -m "build: rigenera fallback, pagine statiche e sitemap [skip ci]"
            git push origin HEAD:feat/admin-totale
          fi
