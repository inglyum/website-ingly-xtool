name: INGLY Brand System — build & QA
on:
  push:
    branches: [feat/brand-system-20261015]
    paths:
      - .github/workflows/sync-brand-system.yml
permissions:
  contents: write
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/brand-system-20261015
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Build data and fallback
        run: npm run build
      - name: Regenerate prerender + sitemap
        run: |
          node scripts/prerender.mjs
          node scripts/generate-sitemap.mjs
      - name: Full test suite
        run: npm test
      - name: Sync generated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "build: sync unified brand storefront and tests [skip ci]"
            git push origin HEAD:feat/brand-system-20261015
          fi

# Re-run after head/base-order fix
