name: INGLY Creator Quote — sync build e test
on:
  push:
    branches: [feat/personalizza-quote-flow-20261015]
    paths:
      - .github/workflows/sync-creator-branch.yml
permissions:
  contents: write
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/personalizza-quote-flow-20261015
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: node scripts/prerender.mjs
      - run: node scripts/generate-sitemap.mjs
      - run: npm test
      - name: Save generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "build: sync Creator quote storefront and fallback [skip ci]"
            git push origin HEAD:feat/personalizza-quote-flow-20261015
          fi
