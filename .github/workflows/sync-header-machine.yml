name: INGLY header machine hotfix — Build & QA
on:
  push:
    branches: [fix/brand-header-machine-20261015]
    paths:
      - .github/workflows/sync-header-machine.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/brand-header-machine-20261015
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: node scripts/prerender.mjs
      - run: node scripts/generate-sitemap.mjs
      - run: npm test
      - name: Synchronize static routes and fallback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "Generated files unchanged"
          else
            git commit -m "build: synchronize header Machine Lab hotfix [skip ci]"
            git push origin HEAD:fix/brand-header-machine-20261015
          fi
