name: Sync pagine prerenderizzate INGLY
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - data/**
      - assets/js/prerender-engine.js
      - assets/js/rotte.js
      - assets/js/lab.js
      - assets/js/verticali.js
      - scripts/prerender.mjs
      - .github/workflows/sync-prerender.yml
permissions:
  contents: write
concurrency:
  group: ingly-prerender-main
  cancel-in-progress: false
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verifica integrità del catalogo
        run: node scripts/validate-data.mjs
      - name: Rigenera pagine statiche dal template e dai dati correnti
        run: node scripts/prerender.mjs
      - name: Verifica pagine generate
        run: node scripts/prerender.mjs --verifica
      - name: Aggiorna pagine statiche solo in caso di differenze
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- about/ academy/ business/ demo/ digital/ faq/ macchine/ materiali/ personalizza/ portfolio/ product/ quote/ shop/ tecnologie/
          if git diff --cached --quiet; then
            echo "Pagine già allineate. Nessun commit necessario."
          else
            git commit -m "chore(prerender): sync static routes with latest INGLY shell [skip ci]"
            git push origin HEAD:main
          fi
