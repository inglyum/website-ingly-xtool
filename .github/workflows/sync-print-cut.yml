name: INGLY Print Cut — build branch e test
on:
  push:
    branches: [feat/print-cut-generator-20261015]
    paths:
      - .github/workflows/sync-print-cut.yml
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/print-cut-generator-20261015
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Rebuild data and JavaScript fallback
        run: npm run build
      - name: Update prerender and sitemap
        run: |
          node scripts/prerender.mjs
          node scripts/generate-sitemap.mjs
      - name: QA completa
        run: npm test
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "build: sync print-cut generator data and sitemap [skip ci]"
            git push origin HEAD:feat/print-cut-generator-20261015
          fi
