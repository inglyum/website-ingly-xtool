name: INGLY — visual browser audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'admin.html'
      - 'assets/css/**'
      - 'assets/js/**'
      - 'assets/images/**'
      - 'tests/**'
      - '.github/workflows/visual-audit.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'admin.html'
      - 'assets/css/**'
      - 'assets/js/**'
      - 'assets/images/**'
      - 'tests/visual-audit.mjs'
      - 'tests/a11y-keyboard.mjs'
      - 'tests/contrast-audit.mjs'
      - 'tests/axe-audit.mjs'
      - 'tests/sprint-01-journeys.mjs'
      - 'tests/sprint-01-compare.mjs'
      - 'scripts/audit-foundation-css.mjs'
      - '.github/workflows/visual-audit.yml'
permissions:
  contents: read
jobs:
  visual-audit:
    runs-on: ubuntu-24.04  # Playwright 1.56 non supporta ancora ubuntu 26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout main baseline for screenshot comparisons
        uses: actions/checkout@v4
        with:
          ref: main
          path: sprint-01-baseline
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install local project dependencies
        run: npm install --no-audit --no-fund
      - name: Test con il catalogo aperto (solo in questa copia, nessun commit)
        # Lo stato «in aggiornamento» scelto dall'Admin nasconde tutti i prodotti:
        # i controlli nel browser devono comunque verificare schede e catalogo.
        run: node -e "const f='data/config.json',fs=require('fs');const c=JSON.parse(fs.readFileSync(f));delete c.catalogo;fs.writeFileSync(f,JSON.stringify(c,null,1))"
      - name: Build current source and prerendered routes before browser checks
        run: |
          npm run build
          node scripts/prerender.mjs
      - name: Inventory CSS selectors and potential collisions
        run: node scripts/audit-foundation-css.mjs
      - name: Install browser automation for QA
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1 axe-core@4.10.3
          npx playwright install --with-deps chromium
      - name: Start INGLY development server
        run: |
          node scripts/dev-server.mjs 8080 > /tmp/ingly-dev-server.log 2>&1 &
          echo $! > /tmp/ingly-dev-server.pid
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ingly-dev-server.log
          exit 1
      - name: Start main baseline server
        run: |
          (cd sprint-01-baseline && node scripts/dev-server.mjs 8081 > /tmp/ingly-main-baseline.log 2>&1) &
          echo $! > /tmp/ingly-main-baseline.pid
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8081/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ingly-main-baseline.log
          exit 1
      - name: Chromium responsive audit — fail on geometric regressions
        env:
          INGLY_VISUAL_STRICT: '1'
        run: node tests/visual-audit.mjs
      - name: Keyboard accessibility regression — interactive controls
        run: node tests/a11y-keyboard.mjs
      - name: Measure computed light/dark text contrast (report baseline)
        run: node tests/contrast-audit.mjs
      - name: WCAG axe-core 20-case light/dark audit (baseline report)
        run: node tests/axe-audit.mjs
      - name: Sprint 01 — four journeys in two themes and widths
        run: node tests/sprint-01-journeys.mjs
      - name: Sprint 01 — comparison screenshots with main baseline
        if: always()
        run: node tests/sprint-01-compare.mjs
      - name: Upload screenshot evidence and JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingly-responsive-screenshots
          path: |
            artifacts/visual-audit/
            artifacts/contrast-audit/
            artifacts/axe-audit/
            artifacts/foundation-css/
            artifacts/sprint-01-journeys/
            artifacts/sprint-01-comparisons/
          if-no-files-found: warn
          retention-days: 14
      - name: Stop development server
        if: always()
        run: |
          if [ -f /tmp/ingly-dev-server.pid ]; then kill "$(cat /tmp/ingly-dev-server.pid)" || true; fi
          if [ -f /tmp/ingly-main-baseline.pid ]; then kill "$(cat /tmp/ingly-main-baseline.pid)" || true; fi
