<title>Il mio primo Natale — Leonardo — INGLY DESIGN</title>
<desc>Rosso = taglio, nero = incisione piena, blu = linea incisa. Ordine: incisione, linee, poi taglio (prima i fori, poi la sagoma).</desc>
