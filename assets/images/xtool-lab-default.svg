 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0dfb0"/><stop offset=".55" stop-color="#d7bd82"/><stop offset="1" stop-color="#977b48"/></linearGradient>
 <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f1dca4" stop-opacity=".06"/><stop offset=".85" stop-color="#e4cb8a" stop-opacity=".5"/><stop offset="1" stop-color="#f9e6b1" stop-opacity=".02"/></linearGradient>
