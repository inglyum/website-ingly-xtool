 <radialGradient id="halo"><stop stop-color="#7fb0a4" stop-opacity=".34"/><stop offset="1" stop-color="#7fb0a4" stop-opacity="0"/></radialGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d5e0d5"/><stop offset=".24" stop-color="#a8bbb2"/><stop offset=".62" stop-color="#526b67"/><stop offset="1" stop-color="#203b3c"/></linearGradient>
